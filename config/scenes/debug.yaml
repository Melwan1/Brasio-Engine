  type: ORTHOGRAPHIC
  eye: [0, 0, 3]
  look_at: [0, 0, 0]
  up: [0, 1, 0]
  left: 0.0
  right: 1.0
  top: 0.0
  bottom: 1.0
  near: 0.0
  far: 10.0
drawables:
