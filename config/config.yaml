application:
  window:
    monitorIndex: 1
    width: 1920
    height: 1080
    title: Brasio Engine

  version: 0.2.1

renderer:
  type: Vulkan
  max_frames_in_flight: 2
  swapchain:
    present_mode: MAILBOX

  pipelines:
    - type: GRAPHICS
      name: Draw particles
      vertex_input: PARTICLE
      shaders:
        vertex: vertex/particle.vert
        fragment: fragment/particle.frag

      dynamic_states:
        - VIEWPORT
        - SCISSOR

      input_assembly:
        primitive_restart: false
        primitive_topology: POINT_LIST

      rasterizer:
        depth_clamp: false
        discard: false
        polygon_mode: FILL
        line_width: 1
        cull_mode: BACK
        front_face: CCW
        depth_bias: false
        depth_bias_constant_factor: 0
        depth_bias_clamp: 0
        depth_bias_slope_factor: 0

      multisampling:
        sample_shading: false
        rasterization_samples: 16
        min_sample_shading: 1
        alpha_to_coverage: false
        alpha_to_one: false

      color_blend_attachment:
        writeMask: RGBA
        blend: false
        src_color_blend_factor: ONE
        dst_color_blend_factor: ZERO
        color_blend_op: ADD
        src_alpha_blend_factor: ONE
        dst_alpha_blend_factor: ZERO
        alpha_blend_op: ADD

      color_blend_state:
        logic_op_enabled: false
        logic_op: COPY

    - type: COMPUTE
      name: Compute particle movement
      shaders:
        compute: compute/particles.comp

logging:
  global_level: TRACE
  specific_levels:
    APPLICATION: DEBUG
    CREATE: INFO
    COMPUTE: DEBUG
    DESTROY: DEBUG
    DEVICE: INFO
    EVENT: DEBUG
    FONTS: TRACE
    GENERAL: INFO
    RENDER: DEBUG
    SHADERS: INFO
