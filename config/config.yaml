application:
  window:
    monitorIndex: 1
    width: 1920
    height: 1080
    title: Brasio Engine

  version: 0.2.1

renderer:
  type: Vulkan
  max_frames_in_flight: 2
  pipelines_file: config/pipelines.yaml
  swapchain:
    present_mode: MAILBOX

scenes:
  directory: scenes/
  root: root

logging:
  global_level: TRACE
  specific_levels:
    APPLICATION: DEBUG
    CREATE:
      global: INFO
      SCENES: TRACE
    COMPUTE: DEBUG
    DESTROY: DEBUG
    DEVICE: INFO
    EVENT: DEBUG
    FONTS: TRACE
    GENERAL: INFO
    RENDER: DEBUG
    SHADERS: INFO
